<!DOCTYPE html>
<html lang="en">
<head>
  <script>!function(){var t=localStorage.getItem("color-theme")||(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compare Lagos Areas — Smart Weather Laundry Scheduler</title>
  <meta name="description" content="Compare current drying conditions across all major Lagos LGAs to find where conditions are best right now.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<main>
  <div class="page-header">
    <div class="flex-between" style="flex-wrap:wrap;gap:var(--spacing-3);">
      <div>
        <p class="section-label">Smart Laundry</p>
        <h1>Lagos Area Comparison</h1>
        <p style="margin-bottom:0;">Live drying conditions ranked across Lagos LGAs. Find the best location to dry right now.</p>
      </div>
      <button id="refreshBtn" class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3"/></svg>
        Refresh
      </button>
    </div>
  </div>

  <div id="bestLocationContainer" style="margin-bottom:var(--spacing-4);"></div>
  <div id="comparisonContainer">
    <div class="card skeleton" style="height:80px;margin-bottom:var(--spacing-3);"></div>
    <div class="card skeleton" style="height:80px;margin-bottom:var(--spacing-3);"></div>
    <div class="card skeleton" style="height:80px;margin-bottom:var(--spacing-3);"></div>
  </div>
</main>
<script type="module" src="js/comparison.js"></script>
