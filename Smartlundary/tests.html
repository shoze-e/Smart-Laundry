<!DOCTYPE html>
<html lang="en">
<head>
  <script>!function(){var t=localStorage.getItem("color-theme")||(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algorithm &amp; Location Tests — Smart Weather Laundry Scheduler</title>
  <meta name="description" content="Algorithm, LGA location, and Best Window diagnostic tests verifying drying score, 20 Lagos LGAs, and recommendation logic.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .test-item {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-left: 4px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--spacing-4);
      margin-bottom: var(--spacing-3);
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 0.88rem;
    }
    .test-item.pass { border-left-color: var(--color-excellent); }
    .test-item.fail { border-left-color: var(--color-poor); }
    .test-item.error { border-left-color: var(--color-moderate); }
    .test-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 100px;
      margin-bottom: var(--spacing-2);
    }
    .test-label.pass  { background: var(--color-excellent-soft); color: var(--color-excellent); }
    .test-label.fail  { background: var(--color-poor-soft);      color: var(--color-poor); }
    .test-label.error { background: var(--color-moderate-soft);  color: var(--color-moderate); }
    .test-name { font-weight: 700; color: var(--color-text-primary); margin-bottom: 4px; }
    .test-detail { font-size: 0.8rem; color: var(--color-text-secondary); }
  </style>
</head>
<body>
<main>
  <div class="page-header">
    <p class="section-label">Development &amp; Verification Tool</p>
    <h1>Algorithm, LGA &amp; Window Tests</h1>
    <p>Sanity checks verifying that the 20 official Lagos LGAs, Best Drying Window diagnostic engine, search system, and drying score logic function properly.</p>
  </div>

  <div id="summary" style="margin-bottom:var(--spacing-4);"></div>
  <div id="results"></div>
</main>

<script type="module" src="js/theme.js"></script>

<script type="module">
  import { UI } from './js/ui.js';
  import { calculateDryingScore } from './js/drying-score.js';
  import { estimateDryingTime } from './js/drying-time.js';
  import { calculateLaundryRecommendation } from './js/laundry.js';
  import { LAGOS_LOCATIONS, getLocationById, searchLocations, isValidLocation, findNearestLGA, isWithinLagosArea } from './data/locations.js';
  import { Storage } from './js/storage.js';
  import { findBestDryingWindow, processHourlyForecast } from './js/forecast.js';
  import { getLagosNow, calculateHaversineDistance } from './js/utils.js';

  document.addEventListener('DOMContentLoaded', () => {
    UI.renderNavbar('tests');
  });

  let passed = 0, failed = 0, errored = 0;

  function runTest(name, fn) {
    const container = document.getElementById('results');
    const div = document.createElement('div');
    div.className = 'test-item';

    try {
      const result = fn();
      if (result.pass) {
        passed++;
        div.classList.add('pass');
        div.innerHTML = `
          <span class="test-label pass">✓ Pass</span>
          <div class="test-name">${name}</div>
          <div class="test-detail">Expected: <strong>${result.expected}</strong> · Got: <strong>${result.actual}</strong></div>`;
      } else {
        failed++;
        div.classList.add('fail');
        div.innerHTML = `
          <span class="test-label fail">✗ Fail</span>
          <div class="test-name">${name}</div>
          <div class="test-detail">Expected: <strong>${result.expected}</strong> · Got: <strong>${result.actual}</strong></div>`;
      }
    } catch (e) {
      errored++;
      div.classList.add('error');
      div.innerHTML = `
        <span class="test-label error">⚡ Error</span>
        <div class="test-name">${name}</div>
        <div class="test-detail">${e.message}</div>`;
    }
    container.appendChild(div);
    updateSummary();
  }

  function updateSummary() {
    const total = passed + failed + errored;
    document.getElementById('summary').innerHTML = `
      <div style="display:flex;gap:var(--spacing-3);flex-wrap:wrap;margin-bottom:var(--spacing-2);">
        <span class="status-badge status-excellent">✓ ${passed} Passed</span>
        ${failed ? `<span class="status-badge status-poor">✗ ${failed} Failed</span>` : ''}
        ${errored ? `<span class="status-badge status-moderate">⚡ ${errored} Errors</span>` : ''}
        <span class="status-badge" style="background:var(--color-surface-secondary);color:var(--color-text-secondary);">${total} Total</span>
      </div>`;
  }

  // ── Algorithm Core Tests ────────────────────────────────────
  runTest("TEST 01 — Excellent weather gives Excellent rating", () => {
    const cond = { temperature: 32, humidity: 45, wind: 20, rainProb: 0, precipitation: 0 };
    const score = calculateDryingScore(cond);
    return { pass: score.category === 'Excellent', expected: 'Excellent', actual: score.category };
  });

  runTest("TEST 02 — Heavy rain forces Poor rating", () => {
    const cond = { temperature: 25, humidity: 90, wind: 5, rainProb: 80, precipitation: 5.0 };
    const score = calculateDryingScore(cond);
    return { pass: score.category === 'Poor', expected: 'Poor', actual: score.category };
  });

  runTest("TEST 03 — Very high humidity (95%) pulls score below 70", () => {
    const cond = { temperature: 28, humidity: 95, wind: 10, rainProb: 10, precipitation: 0 };
    const score = calculateDryingScore(cond);
    return { pass: score.score < 70, expected: 'Score < 70', actual: score.score };
  });

  runTest("TEST 04 — Silk dries faster than towels", () => {
    const cond = { temperature: 25, humidity: 60, wind: 10 };
    const tSilk = estimateDryingTime('silk', 'normal_spin', 'medium', cond);
    const tTowels = estimateDryingTime('towels', 'normal_spin', 'medium', cond);
    return { pass: tSilk < tTowels, expected: 'Silk < Towels', actual: `${tSilk.toFixed(1)}h vs ${tTowels.toFixed(1)}h` };
  });

  runTest("TEST 05 — Large load dries slower than small load", () => {
    const cond = { temperature: 25, humidity: 60, wind: 10 };
    const tSmall = estimateDryingTime('cotton', 'normal_spin', 'small', cond);
    const tLarge = estimateDryingTime('cotton', 'normal_spin', 'large', cond);
    return { pass: tSmall < tLarge, expected: 'Small < Large', actual: `${tSmall.toFixed(1)}h vs ${tLarge.toFixed(1)}h` };
  });

  runTest("TEST 06 — High spin produces lower time than hand wash", () => {
    const cond = { temperature: 28, humidity: 60, wind: 15 };
    const tHigh = estimateDryingTime('cotton', 'high_spin', 'medium', cond);
    const tHand = estimateDryingTime('cotton', 'hand_wash', 'medium', cond);
    return { pass: tHigh < tHand, expected: 'High spin < Hand wash', actual: `${tHigh.toFixed(1)}h vs ${tHand.toFixed(1)}h` };
  });

  runTest("TEST 07 — Rain probability ≥70% caps score at 40", () => {
    const cond = { temperature: 30, humidity: 40, wind: 20, rainProb: 75, precipitation: 0 };
    const score = calculateDryingScore(cond);
    return { pass: score.score <= 40, expected: '≤ 40', actual: score.score };
  });

  runTest("TEST 08 — Zero rain probability earns maximum rain factor", () => {
    const cond = { temperature: 30, humidity: 45, wind: 18, rainProb: 0, precipitation: 0 };
    const score = calculateDryingScore(cond);
    const rainFactor = score.factors.find(f => f.name === 'Rain Prob.');
    return { pass: rainFactor && rainFactor.contribution === rainFactor.max, expected: 'contribution = max', actual: `${rainFactor?.contribution} / ${rainFactor?.max}` };
  });

  runTest("TEST 09 — Score is between 0 and 100 under all conditions", () => {
    const conds = [
      { temperature: 45, humidity: 0, wind: 50, rainProb: 0, precipitation: 0 },
      { temperature: 10, humidity: 100, wind: 0, rainProb: 100, precipitation: 10 }
    ];
    const scores = conds.map(c => calculateDryingScore(c).score);
    const valid = scores.every(s => s >= 0 && s <= 100);
    return { pass: valid, expected: '0–100 always', actual: scores.join(', ') };
  });

  // ── Lagos LGA Location Tests ────────────────────────────────
  runTest("TEST 10 — All 20 Official Lagos LGAs are present in dataset", () => {
    const expectedLGAs = [
      "Agege", "Ajeromi-Ifelodun", "Alimosho", "Amuwo-Odofin", "Apapa",
      "Badagry", "Epe", "Eti-Osa", "Ibeju-Lekki", "Ifako-Ijaiye",
      "Ikeja", "Ikorodu", "Kosofe", "Lagos Island", "Lagos Mainland",
      "Mushin", "Ojo", "Oshodi-Isolo", "Shomolu", "Surulere"
    ];
    const names = LAGOS_LOCATIONS.map(l => l.name);
    const allPresent = expectedLGAs.every(lga => names.includes(lga));
    return {
      pass: LAGOS_LOCATIONS.length === 20 && allPresent,
      expected: '20 official LGAs',
      actual: `${LAGOS_LOCATIONS.length} LGAs found`
    };
  });

  runTest("TEST 11 — All 20 LGAs have valid numeric coordinates", () => {
    const allValid = LAGOS_LOCATIONS.every(lga => isValidLocation(lga));
    return {
      pass: allValid,
      expected: 'All 20 valid coordinates (lat 6.3–6.8, lon 2.7–4.2)',
      actual: allValid ? 'All 20 Valid' : 'Some Invalid'
    };
  });

  runTest("TEST 12 — Case-insensitive LGA search (e.g. 'Ike' -> Ikeja, 'sur' -> Surulere)", () => {
    const ikeMatches = searchLocations("Ike");
    const surMatches = searchLocations("sur");
    const lagosMatches = searchLocations("lagos");
    const pass = ikeMatches.some(l => l.name === 'Ikeja') &&
                 surMatches.some(l => l.name === 'Surulere') &&
                 lagosMatches.length >= 2;
    return {
      pass: pass,
      expected: 'Matches found for Ike, sur, lagos',
      actual: `Ikeja:${ikeMatches.length}, Surulere:${surMatches.length}, Lagos:${lagosMatches.length}`
    };
  });

  runTest("TEST 13 — Popular area search matches LGA (e.g. 'Lekki' -> Eti-Osa, 'Yaba' -> Lagos Mainland)", () => {
    const lekki = searchLocations("Lekki");
    const yaba = searchLocations("Yaba");
    const festac = searchLocations("Festac");
    const pass = lekki.some(l => l.id === 'eti-osa') &&
                 yaba.some(l => l.id === 'lagos-mainland') &&
                 festac.some(l => l.id === 'amuwo-odofin');
    return {
      pass: pass,
      expected: 'Lekki->Eti-Osa, Yaba->Lagos Mainland, Festac->Amuwo-Odofin',
      actual: pass ? 'Mapped accurately' : 'Mapping failed'
    };
  });

  runTest("TEST 14 — Active LGA storage persistence and retrieval", () => {
    Storage.setActiveLocationId("surulere");
    const retrieved = Storage.getActiveLocationId();
    const lga = Storage.getActiveLocation();
    Storage.setActiveLocationId("ikeja");
    return {
      pass: retrieved === "surulere" && lga.name === "Surulere",
      expected: 'surulere',
      actual: retrieved
    };
  });

  // ── Step 19: Comprehensive Meteorological Scenarios ─────────
  const lagosNow = getLagosNow();
  const testDateStr = lagosNow.dateStr;

  function buildHourlyData(hourOverrides, dateStr = testDateStr) {
    const hourly = {
      time: [],
      temperature_2m: [],
      relative_humidity_2m: [],
      precipitation_probability: [],
      precipitation: [],
      wind_speed_10m: [],
      weather_code: [],
      is_day: []
    };

    for (let h = 0; h < 24; h++) {
      const timeStr = `${dateStr}T${String(h).padStart(2, '0')}:00`;
      hourly.time.push(timeStr);
      
      const custom = hourOverrides(h);
      hourly.temperature_2m.push(custom.temp ?? 29);
      hourly.relative_humidity_2m.push(custom.humidity ?? 65);
      hourly.precipitation_probability.push(custom.rainProb ?? 10);
      hourly.precipitation.push(custom.precip ?? 0);
      hourly.wind_speed_10m.push(custom.wind ?? 14);
      hourly.weather_code.push(custom.code ?? 1);
      hourly.is_day.push(h >= 6 && h <= 18 ? 1 : 0);
    }

    return processHourlyForecast(hourly);
  }

  runTest("TEST 15 — Scenario 1 (Sunny, low rain, low hum) -> Good/Excellent Window", () => {
    const processed = buildHourlyData(h => ({ temp: 31, humidity: 55, wind: 16, rainProb: 5, precip: 0 }));
    const res = findBestDryingWindow(processed, 4, new Date(`${testDateStr}T06:00:00+01:00`));
    const pass = res.hasSafeWindow && res.status === 'optimal' && res.recommendation.includes('outdoor');
    return {
      pass,
      expected: 'hasSafeWindow: true (optimal status)',
      actual: `hasSafeWindow: ${res.hasSafeWindow}, status: ${res.status}`
    };
  });

  runTest("TEST 16 — Scenario 2 (Cloudy, moderate humidity, low rain) -> Good/Available Window", () => {
    const processed = buildHourlyData(h => ({ temp: 28, humidity: 72, wind: 12, rainProb: 15, precip: 0 }));
    const res = findBestDryingWindow(processed, 3.5, new Date(`${testDateStr}T06:00:00+01:00`));
    const pass = res.hasSafeWindow && res.avgScore >= 50;
    return {
      pass,
      expected: 'hasSafeWindow: true (score >= 50)',
      actual: `hasSafeWindow: ${res.hasSafeWindow}, score: ${res.avgScore}`
    };
  });

  runTest("TEST 17 — Scenario 3 (High humidity 80%, low rain) -> Available Window with drying advice", () => {
    const processed = buildHourlyData(h => ({ temp: 27, humidity: 80, wind: 8, rainProb: 20, precip: 0 }));
    const res = findBestDryingWindow(processed, 3, new Date(`${testDateStr}T06:00:00+01:00`));
    const pass = res.hasSafeWindow && res.explanation.length > 0;
    return {
      pass,
      expected: 'hasSafeWindow: true (does not aggressively discard reasonable window)',
      actual: `hasSafeWindow: ${res.hasSafeWindow}, title: "${res.title}"`
    };
  });

  runTest("TEST 18 — Scenario 4 (Heavy rain & high probability) -> No outdoor window", () => {
    const processed = buildHourlyData(h => ({ temp: 24, humidity: 92, wind: 6, rainProb: 80, precip: 3.5 }));
    const res = findBestDryingWindow(processed, 3.5, new Date(`${testDateStr}T06:00:00+01:00`));
    const pass = !res.hasSafeWindow && res.primaryReason === 'RAIN_RISK';
    return {
      pass,
      expected: 'hasSafeWindow: false with RAIN_RISK diagnosis',
      actual: `hasSafeWindow: ${res.hasSafeWindow}, reason: ${res.primaryReason}`
    };
  });

  runTest("TEST 19 — Scenario 5 (Good morning, rain in afternoon) -> Morning window with rain warning", () => {
    const processed = buildHourlyData(h => {
      if (h >= 8 && h <= 12) return { temp: 30, humidity: 60, wind: 15, rainProb: 5, precip: 0 };
      if (h >= 13) return { temp: 26, humidity: 88, wind: 10, rainProb: 75, precip: 2.0 };
      return { temp: 25, humidity: 75, wind: 10, rainProb: 20, precip: 0 };
    });
    const res = findBestDryingWindow(processed, 4, new Date(`${testDateStr}T06:00:00+01:00`));
    const pass = res.hasSafeWindow && res.rainAfterWindow === true;
    return {
      pass,
      expected: 'hasSafeWindow: true with rainAfterWindow: true',
      actual: `hasSafeWindow: ${res.hasSafeWindow}, rainAfter: ${res.rainAfterWindow}`
    };
  });

  runTest("TEST 20 — Scenario 6 (Afternoon past daylight) -> Diagnoses past window & computes Tomorrow Fallback", () => {
    const todayProcessed = buildHourlyData(h => ({ temp: 28, humidity: 70, wind: 12, rainProb: 10, precip: 0 }), testDateStr);
    const tomorrowDate = new Date(lagosNow.timestamp + 24 * 3600 * 1000);
    const tomorrowDateStr = tomorrowDate.toISOString().split('T')[0];
    const tomorrowProcessed = buildHourlyData(h => ({ temp: 31, humidity: 55, wind: 16, rainProb: 5, precip: 0 }), tomorrowDateStr);

    const allProcessed = [...todayProcessed, ...tomorrowProcessed];
    const res = findBestDryingWindow(allProcessed, 3.5);
    const pass = res !== null && (res.hasSafeWindow || res.nextBestWindow !== undefined);
    return {
      pass,
      expected: 'Handles real-time current Lagos hour and offers next best window if evening',
      actual: `title: "${res.title}", nextBestWindow: ${res.nextBestWindow ? 'Found' : 'None'}`
    };
  });

  // ── Architecture Consistency Tests ──────────────────────────
  runTest("TEST 21 — Central recommendation model returns distinct weatherCondition, windowStatus and score", () => {
    const mockWeather = {
      current: { temperature_2m: 25.2, relative_humidity_2m: 89, wind_speed_10m: 10.4, weather_code: 61, precipitation: 0.2 },
      hourly: {
        time: Array.from({length: 24}, (_, i) => `${testDateStr}T${String(i).padStart(2, '0')}:00`),
        temperature_2m: Array(24).fill(25.2),
        relative_humidity_2m: Array(24).fill(89),
        precipitation_probability: Array(24).fill(8),
        precipitation: Array(24).fill(0.2),
        wind_speed_10m: Array(24).fill(10.4),
        weather_code: Array(24).fill(61),
        is_day: Array(24).fill(1)
      }
    };
    const rec = calculateLaundryRecommendation(mockWeather, { fabric: 'cotton' });
    const pass = typeof rec.score === 'number' &&
                 typeof rec.weatherCondition === 'string' &&
                 typeof rec.windowStatus === 'string' &&
                 rec.currentConditions.temperature === 25.2;
    return {
      pass,
      expected: 'Consistent data structure with weatherCondition and windowStatus',
      actual: `score: ${rec.score}, condition: "${rec.weatherCondition}", windowStatus: "${rec.windowStatus}"`
    };
  });

  runTest("TEST 22 — Separation of Weather Condition from Drying Window", () => {
    const mockWeather = {
      current: { temperature_2m: 24, relative_humidity_2m: 90, wind_speed_10m: 8, weather_code: 63, precipitation: 2.0 },
      hourly: {
        time: Array.from({length: 24}, (_, i) => `${testDateStr}T${String(i).padStart(2, '0')}:00`),
        temperature_2m: Array(24).fill(24),
        relative_humidity_2m: Array(24).fill(90),
        precipitation_probability: Array(24).fill(75),
        precipitation: Array(24).fill(2.0),
        wind_speed_10m: Array(24).fill(8),
        weather_code: Array(24).fill(63),
        is_day: Array(24).fill(1)
      }
    };
    const rec = calculateLaundryRecommendation(mockWeather);
    const pass = rec.weatherCondition.toLowerCase().includes('drizzle') || rec.weatherCondition.toLowerCase().includes('rain') &&
                 rec.windowStatus === 'NO_SAFE_WINDOW';
    return {
      pass,
      expected: 'weatherCondition = "Drizzle" & windowStatus = "NO_SAFE_WINDOW"',
      actual: `condition: "${rec.weatherCondition}", windowStatus: "${rec.windowStatus}"`
    };
  });

  runTest("TEST 23 — Compare ranking prioritizes usable safe window above pure score", () => {
    const lgaA = { id: 'ajeromi', name: 'Ajeromi-Ifelodun', score: 59, hasSafeWindow: false, rainProb: 8 };
    const lgaB = { id: 'ikeja', name: 'Ikeja', score: 72, hasSafeWindow: true, rainProb: 12 };
    const list = [lgaA, lgaB];

    list.sort((a, b) => {
      if (a.hasSafeWindow && !b.hasSafeWindow) return -1;
      if (!a.hasSafeWindow && b.hasSafeWindow) return 1;
      if (b.score !== a.score) return b.score - a.score;
      return a.rainProb - b.rainProb;
    });

    const pass = list[0].id === 'ikeja';
    return {
      pass,
      expected: '#1 rank is Ikeja (hasSafeWindow: true)',
      actual: `#1 rank: ${list[0].name}`
    };
  });

  // ── Automatic Geolocation & Location Mapping Tests ──────────
  runTest("TEST 24 — Haversine geographic distance formula calculates accurate distance", () => {
    // Distance between Ikeja (6.6018, 3.3515) and Lagos Island (6.4550, 3.3941) is ~17 km
    const dist = calculateHaversineDistance(6.6018, 3.3515, 6.4550, 3.3941);
    const pass = dist >= 15 && dist <= 20;
    return {
      pass,
      expected: "15km – 20km (actual ~17km)",
      actual: `${dist.toFixed(2)} km`
    };
  });

  runTest("TEST 25 — GPS Coordinates map accurately to Ojo LGA (LASU / Alaba area)", () => {
    // Coordinates near LASU Main Campus / Alaba: 6.468, 3.167
    const result = findNearestLGA(6.468, 3.167);
    const pass = result.isWithinLagos && result.lga && result.lga.id === 'ojo';
    return {
      pass,
      expected: "ojo (Ojo LGA)",
      actual: result.lga ? result.lga.id : "null"
    };
  });

  runTest("TEST 26 — GPS Coordinates map accurately to Ikeja LGA (Computer Village / Alausa)", () => {
    // Coordinates near Alausa Ikeja: 6.615, 3.358
    const result = findNearestLGA(6.615, 3.358);
    const pass = result.isWithinLagos && result.lga && result.lga.id === 'ikeja';
    return {
      pass,
      expected: "ikeja (Ikeja LGA)",
      actual: result.lga ? result.lga.id : "null"
    };
  });

  runTest("TEST 27 — GPS Coordinates map accurately to Eti-Osa LGA (Lekki / Victoria Island)", () => {
    // Coordinates near Lekki Phase 1: 6.448, 3.475
    const result = findNearestLGA(6.448, 3.475);
    const pass = result.isWithinLagos && result.lga && result.lga.id === 'eti-osa';
    return {
      pass,
      expected: "eti-osa (Eti-Osa LGA)",
      actual: result.lga ? result.lga.id : "null"
    };
  });

  runTest("TEST 28 — Coordinates outside Lagos State are rejected (Abuja, London, Ibadan)", () => {
    const abuja = findNearestLGA(9.0765, 7.3986); // Abuja
    const london = findNearestLGA(51.5074, -0.1278); // London
    const ibadan = findNearestLGA(7.3775, 3.9470); // Ibadan
    const pass = !abuja.isWithinLagos && !london.isWithinLagos && !ibadan.isWithinLagos &&
                 abuja.message.includes('outside the currently supported Lagos State coverage');
    return {
      pass,
      expected: "isWithinLagos = false for non-Lagos coordinates",
      actual: `Abuja within: ${abuja.isWithinLagos}, London within: ${london.isWithinLagos}, Ibadan within: ${ibadan.isWithinLagos}`
    };
  });

  runTest("TEST 29 — Location detection mode persists and distinguishes 'gps' vs 'manual'", () => {
    Storage.setActiveLocationId("ojo", "gps");
    const mode1 = Storage.getLocationDetectionMode();
    const loc1 = Storage.getActiveLocationId();

    Storage.setActiveLocationId("ikeja", "manual");
    const mode2 = Storage.getLocationDetectionMode();
    const loc2 = Storage.getActiveLocationId();

    const pass = mode1 === "gps" && loc1 === "ojo" && mode2 === "manual" && loc2 === "ikeja";
    return {
      pass,
      expected: "mode1: gps (ojo), mode2: manual (ikeja)",
      actual: `mode1: ${mode1} (${loc1}), mode2: ${mode2} (${loc2})`
    };
  });

  runTest("TEST 30 — Manual selection overrides automatically detected location", () => {
    // 1. Auto detect sets Ojo with GPS mode
    Storage.setActiveLocationId("ojo", "gps");
    // 2. User manually chooses Ikeja
    Storage.setActiveLocationId("ikeja", "manual");
    
    const active = Storage.getActiveLocation();
    const mode = Storage.getLocationDetectionMode();

    const pass = active.id === "ikeja" && mode === "manual";
    return {
      pass,
      expected: "Active: ikeja, Mode: manual",
      actual: `Active: ${active.id}, Mode: ${mode}`
    };
  });
</script>
</body>
</html>
