<!DOCTYPE html>
<html lang="en">
<head>
  <script>!function(){var t=localStorage.getItem("color-theme")||(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t)}();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Smart Weather Laundry Scheduler</title>
  <meta name="description" content="Check today's laundry conditions for your Lagos location. Live weather analysis, drying score, and recommendations.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007AFF">
</head>
<body>
  <main>
    <!-- Notification card (rendered before JS loads) -->
    <div class="notif-card" id="notifCard">
      <div class="notif-card-info">
        <h4>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle;margin-right:4px;"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Smart Notifications
        </h4>
        <p>Get alerts when your drying window opens or rain approaches.</p>
      </div>
      <label class="toggle-switch" aria-label="Enable notifications">
        <input type="checkbox" id="notifToggle">
        <span class="toggle-slider"></span>
      </label>
    </div>

    <!-- Dynamic dashboard content -->
    <div id="dashboardContent">
      <div class="card skeleton" style="height:220px;margin-bottom:var(--spacing-4);"></div>
      <div class="card skeleton" style="height:180px;margin-bottom:var(--spacing-4);"></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--spacing-3);">
        <div class="skeleton" style="height:90px;border-radius:var(--radius-md);"></div>
        <div class="skeleton" style="height:90px;border-radius:var(--radius-md);"></div>
      </div>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(r => console.log('[SW] Registered:', r.scope))
          .catch(e => console.warn('[SW] Registration failed:', e));
      });
    }
  </script>
</body>
</html>
